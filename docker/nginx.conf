worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Portraits in public/assets retain stable names; only Vite's hashed JS/CSS are immutable.
    map $uri $cache_control {
        default "no-cache";
        /healthz "no-store";
        "~^/assets/.+-[A-Za-z0-9_-]{8,}[.](js|css)$" "public, max-age=31536000, immutable";
        ~*[.](png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf)$ "public, max-age=3600, must-revalidate";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control $cache_control;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            try_files $uri =404;
        }

        location ~ /[.] {
            return 404;
        }

        location ~* [.](js|css|map|json|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
